[project]
name = "cuda-nuplan-simulator-dev"
version = "0.1.0"
description = "Reproducible development environment for the standalone CUDA nuPlan simulator pipeline"
requires-python = ">=3.10,<3.11"
dependencies = [
    "cmake>=3.24,<4",
    "imageio-ffmpeg>=0.6,<1",
    "matplotlib>=3.8,<4",
    "ninja>=1.11,<2",
    "pillow>=10,<13",
]

[tool.uv]
package = false
required-version = ">=0.12.0"

[dependency-groups]
train = [
    "numpy>=1.26,<3",
    "pybind11>=2.13,<4",
    "tensorboard>=2.17,<3",
    "torch>=2.4,<2.7",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "platform_system == 'Linux'" },
    { index = "pytorch-cpu", marker = "platform_system != 'Linux'" },
]
