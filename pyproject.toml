[project]
name = "cuda-nuplan-simulator-dev"
version = "0.1.0"
description = "Reproducible development environment for the standalone CUDA nuPlan simulator pipeline"
requires-python = ">=3.10,<3.11"
dependencies = [
    "cmake>=3.24,<4",
    "matplotlib>=3.8,<4",
    "ninja>=1.11,<2",
    "pillow>=10,<13",
]

[tool.uv]
package = false
required-version = ">=0.12.0"
